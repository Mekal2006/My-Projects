<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Timetable Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Times New Roman', Times, serif; }
        body { display: flex; height: 100vh; background-color: #f4f4f4; font-size: 14px; }

        .sidebar {
            width: 20%; background-color: #2c3e50; color: white; padding: 15px;
            display: flex; flex-direction: column; user-select: none;
        }
        .sidebar h2 { font-size: 1.1rem; margin-bottom: 15px; text-align: center; font-family: Arial, sans-serif; }
        
        .subject-container { display: flex; gap: 5px; margin-bottom: 8px; }
        .subject-btn {
            flex: 1; background-color: #34495e; color: white; border: 1px solid #1abc9c;
            padding: 8px 8px 8px 12px; cursor: pointer; text-align: left;
            font-size: 0.85rem; transition: 0.2s; outline: none;
        }
        .subject-btn:hover, .subject-btn:focus { background-color: #1abc9c; border-color: white; border-left-color: white !important; }
        
        .subject-btn.registered { background-color: #27ae60; border-color: #2ecc71; text-decoration: line-through; }
        .subject-btn.registered:hover, .subject-btn.registered:focus { background-color: #e74c3c; border-color: #c0392b; text-decoration: none; }
        .subject-btn.registered:hover::after, .subject-btn.registered:focus::after { content: " (Remove)"; font-size: 0.75rem; font-style: italic; }
        
        .edit-btn {
            display: none; background-color: #f39c12; color: white; border: none; 
            border-radius: 4px; padding: 0 10px; cursor: pointer; font-size: 1.1rem; outline: none; transition: 0.2s;
        }
        .edit-btn:hover, .edit-btn:focus { background-color: #e67e22; border: 1px solid white; }
        .subject-container.is-registered .edit-btn { display: block; }
        
        .reset-btn { 
            background-color: #e74c3c; color: white; border: none; padding: 10px;
            margin-top: auto; text-align: center; cursor: pointer; font-size: 0.9rem; transition: 0.2s; outline: none;
        }
        .reset-btn:hover, .reset-btn:focus { background-color: #c0392b; border-color: white; border: 1px solid white;}

        .main-content { width: 80%; padding: 20px 40px; background-color: white; overflow-y: auto; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; }

        table { 
            width: 100%; border-collapse: collapse; font-size: 0.85rem; 
            table-layout: fixed; word-break: break-word; 
        }
        th, td { border: 2px solid black; padding: 6px 8px; vertical-align: middle; }
        th { font-weight: bold; text-align: left; background-color: white; }
        
        tr.day-end-row { border-bottom: 4px solid darkred; }
        
        th:nth-child(1) { width: 12%; }
        th:nth-child(2) { width: 33%; }
        th:nth-child(3) { width: 20%; }
        th:nth-child(4) { width: 35%; }

        .day-col { font-weight: bold; text-transform: uppercase; vertical-align: top; background-color: white; color: black; }
        
        .day-metric-text { font-size: 0.75rem; font-weight: normal; color: #555; display: block; margin-top: 4px; text-transform: none; }
        .day-metric-text:first-of-type { margin-top: 10px; } 
        
        .time-cell { position: relative; padding-right: 100px !important; }
        .side-gap {
            position: absolute; right: 0px; top: 100%; transform: translateY(-50%);
            background-color: white; padding: 0 5px; z-index: 10;
            display: flex; align-items: center; color: #555; font-style: italic;
            font-size: 0.75rem; white-space: nowrap; border: 1px solid black; border-radius: 4px;
        }
        .gap-bracket { font-size: 1.2rem; font-weight: 300; margin-right: 4px; color: black; font-style: normal; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 100;
        }
        .modal { background: white; padding: 20px; border-radius: 8px; width: 350px; font-family: Arial, sans-serif; }
        .modal h3 { margin-bottom: 15px; color: #2c3e50; font-size: 1.1rem; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; }
        .input-group input, .input-group select { width: 100%; padding: 6px; border: 2px solid #ccc; border-radius: 4px; font-size: 0.9rem; outline: none; }
        .input-group input:focus, .input-group select:focus { border-color: #1abc9c; }
        .error-text { color: red; font-size: 0.8rem; margin-top: 5px; display: none; }
        .modal-actions { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white; font-size: 0.85rem; outline: none;}
        .btn:focus { border: 2px solid black; }
        .btn-cancel { background-color: #95a5a6; }
        .btn-add { background-color: #e74c3c; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>AVAILABLE COURSES</h2>
        <div id="subject-list"></div>
        <button class="reset-btn" onclick="clearSchedule()">Reset Entire Schedule</button>
    </div>

    <div class="main-content">
        <h1>Class Timetable</h1>
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Subject(s)</th>
                    <th>Teacher(s)</th>
                    <th>Time(s)</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <!-- Javascript Injection -->
            </tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal" id="modal-content">
            <h3 id="modal-title">Add Course</h3>
            
            <div class="input-group" id="group-classes" style="display: none;">
                <label>Classes per week (English Immersion):</label>
                <select id="input-classes">
                    <option value="1">1 Class</option>
                    <option value="2">2 Classes</option>
                </select>
            </div>

            <div class="input-group">
                <label>Section (Skip for Null):</label>
                <input type="text" id="input-section" placeholder="e.g., c4, v16" autocomplete="off">
                <div class="error-text" id="err-section">Invalid format. Use 1 letter + 1 or 2 digits.</div>
            </div>

            <div class="input-group">
                <label>Teacher Name (Skip for Null):</label>
                <input type="text" id="input-teacher" maxlength="70" placeholder="e.g., dr. smith" autocomplete="off">
            </div>

            <div class="input-group">
                <label>Start Time:</label>
                <input type="text" id="input-start" placeholder="e.g., 2pm, 1100a, 1230p" autocomplete="off">
                <div class="error-text" id="err-time" style="margin-top: 5px;"></div>
            </div>

            <div class="input-group">
                <label>Select 1st Day:</label>
                <select id="input-day1">
                    <option value="MONDAY">Monday</option>
                    <option value="TUESDAY">Tuesday</option>
                    <option value="WEDNESDAY">Wednesday</option>
                    <option value="THURSDAY">Thursday</option>
                    <option value="FRIDAY">Friday</option>
                    <option value="SATURDAY">Saturday</option>
                </select>
            </div>

            <div class="input-group" id="group-day2">
                <label>Select 2nd Day:</label>
                <select id="input-day2">
                    <option value="MONDAY">Monday</option>
                    <option value="TUESDAY">Tuesday</option>
                    <option value="WEDNESDAY">Wednesday</option>
                    <option value="THURSDAY">Thursday</option>
                    <option value="FRIDAY">Friday</option>
                    <option value="SATURDAY">Saturday</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-add" id="submit-btn" onclick="validateAndAdd()">Add Course</button>
            </div>
        </div>
    </div>

    <script>
        const subjectsConfig = {
            "Operating Systems": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#2c3e50" }, 
            "Analysis of Algorithms": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#8e44ad" }, 
            "Innovation and Entrepreneurship": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#c0392b" }, 
            "Information Security": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#27ae60" }, 
            "Cloud computing": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#d35400" }, 
            "Web technologies": { credits: 3, type: "lecture", reqMins: 75, daysReq: 2, color: "#2980b9" }, 
            "Operating system lab": { credits: 1, type: "lab", reqMins: 150, daysReq: 1, color: "#16a085" }, 
            "English Immersion": { credits: 0, type: "lecture", reqMins: 75, daysReq: "dynamic", color: "#833471" } 
        };

        const daysOfWeek = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
        
        let timetable = { MONDAY: [], TUESDAY: [], WEDNESDAY: [], THURSDAY: [], FRIDAY: [], SATURDAY: [] };
        let registeredData = {}; 
        let activeSubject = null;

        function init() {
            const sidebar = document.getElementById('subject-list');
            for (let sub in subjectsConfig) {
                let safeId = sub.replace(/\s+/g, '-');
                
                let container = document.createElement('div');
                container.className = 'subject-container';
                container.id = `container-${safeId}`;

                let btn = document.createElement('button');
                btn.className = 'subject-btn';
                btn.id = `btn-${safeId}`;
                btn.innerText = sub;
                btn.style.borderLeft = `8px solid ${subjectsConfig[sub].color}`;
                btn.onclick = () => {
                    if (btn.classList.contains('registered')) {
                        if (confirm(`Unregister ${sub} and remove it from the timetable?`)) removeCourse(sub);
                    } else {
                        openModal(sub, false);
                    }
                };

                let editBtn = document.createElement('button');
                editBtn.className = 'edit-btn';
                editBtn.innerHTML = '&#9998;'; 
                editBtn.title = 'Edit Course Details';
                editBtn.onclick = () => openModal(sub, true);

                container.appendChild(btn);
                container.appendChild(editBtn);
                sidebar.appendChild(container);
            }
            renderTable();

            document.getElementById('modal-content').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (document.activeElement.classList.contains('btn-cancel')) {
                        closeModal();
                        return;
                    }
                    let elements = Array.from(this.querySelectorAll('input, select, .btn-add')).filter(el => el.offsetParent !== null);
                    let idx = elements.indexOf(document.activeElement);
                    if (idx > -1 && idx < elements.length - 1) {
                        elements[idx + 1].focus();
                    } else if (idx === elements.length - 1) {
                        validateAndAdd(); 
                    }
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (document.getElementById('modal').style.display === 'flex') return;
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                let buttons = Array.from(document.querySelectorAll('.sidebar .subject-btn, .sidebar .reset-btn'));
                let idx = buttons.indexOf(document.activeElement);
                let dir = e.key === 'ArrowDown' ? 1 : -1;
                let nextIdx = idx === -1 && dir === 1 ? 0 : idx + dir;
                
                if (nextIdx >= 0 && nextIdx < buttons.length) {
                    buttons[nextIdx].focus();
                }
            }
        });

        function removeCourse(subName) {
            for (let day of daysOfWeek) timetable[day] = timetable[day].filter(c => c.id !== subName);
            delete registeredData[subName];
            
            let safeId = subName.replace(/\s+/g, '-');
            document.getElementById(`btn-${safeId}`).classList.remove('registered');
            document.getElementById(`container-${safeId}`).classList.remove('is-registered');
            
            renderTable();
        }

        function openModal(subjectName, isEdit) {
            activeSubject = subjectName;
            let config = subjectsConfig[subjectName];
            
            let titlePrefix = isEdit ? 'Edit' : 'Add';
            document.getElementById('modal-title').innerText = `${titlePrefix}: ${subjectName} (${config.reqMins} mins)`;
            document.getElementById('submit-btn').innerText = isEdit ? 'Save Changes' : 'Add Course';
            
            document.getElementById('err-section').style.display = 'none';
            document.getElementById('err-time').style.display = 'none';
            
            if (config.daysReq === 1) {
                document.getElementById('group-day2').style.display = 'none';
                document.getElementById('group-classes').style.display = 'none';
            } else if (config.daysReq === 2) {
                document.getElementById('group-day2').style.display = 'block';
                document.getElementById('group-classes').style.display = 'none';
            } else if (config.daysReq === "dynamic") {
                document.getElementById('group-classes').style.display = 'block';
                document.getElementById('group-day2').style.display = 'block';
                document.getElementById('input-classes').onchange = (e) => {
                    document.getElementById('group-day2').style.display = e.target.value === "2" ? 'block' : 'none';
                };
            }

            if (isEdit && registeredData[subjectName]) {
                let data = registeredData[subjectName];
                document.getElementById('input-section').value = data.section === 'Null' ? '' : data.section;
                document.getElementById('input-teacher').value = data.teacher === 'Null' ? '' : data.teacher;
                document.getElementById('input-start').value = data.startFormatted;
                document.getElementById('input-day1').value = data.day1;
                
                if (config.daysReq === "dynamic") {
                    document.getElementById('input-classes').value = data.classes;
                    document.getElementById('group-day2').style.display = data.classes === "2" ? 'block' : 'none';
                }
                if (data.day2) document.getElementById('input-day2').value = data.day2;
                
            } else {
                document.getElementById('input-section').value = '';
                document.getElementById('input-teacher').value = '';
                document.getElementById('input-start').value = '';
                document.getElementById('input-day1').value = 'MONDAY';
                document.getElementById('input-day2').value = 'TUESDAY';
                if (config.daysReq === "dynamic") document.getElementById('input-classes').value = "2"; 
            }

            document.getElementById('modal').style.display = 'flex';
            document.getElementById('input-section').focus(); 
        }

        function closeModal() { 
            document.getElementById('modal').style.display = 'none'; 
            activeSubject = null; 
            document.body.focus(); 
        }

        function parseSmartTime(str) {
            str = str.toLowerCase().replace(/\s+/g, ''); 
            if (!str) return null;

            let isPM = str.includes('p');
            let isAM = str.includes('a');
            str = str.replace(/[^0-9:]/g, ''); 

            if (str === '') return null;

            let h = 0, m = 0;
            if (str.includes(':')) {
                let parts = str.split(':');
                h = parseInt(parts[0], 10) || 0;
                m = parseInt(parts[1], 10) || 0;
            } else if (str.length <= 2) {
                h = parseInt(str, 10) || 0;
            } else if (str.length === 3) {
                h = parseInt(str.substring(0, 1), 10);
                m = parseInt(str.substring(1), 10);
            } else if (str.length === 4) {
                h = parseInt(str.substring(0, 2), 10);
                m = parseInt(str.substring(2), 10);
            }

            if (h > 23 || m > 59) return null;

            if (isPM && h < 12) h += 12;
            if (isAM && h === 12) h = 0;
            
            if (!isAM && !isPM && h <= 12) {
                if (h >= 1 && h <= 7) h += 12; 
            }
            
            return (h * 60) + m;
        }

        function formatForInput(mins) {
            let h = Math.floor(mins / 60) % 12 || 12;
            let m = mins % 60;
            let ampm = Math.floor(mins / 60) >= 12 ? 'pm' : 'am';
            return `${h}:${m < 10 ? '0'+m : m} ${ampm}`;
        }

        function buildTimeDisplay(startMins, endMins) {
            let s = formatForInput(startMins);
            let e = formatForInput(endMins);

            let sParts = s.split(' ');
            let eParts = e.split(' ');
            
            let startStr = sParts[0].endsWith(':00') ? sParts[0].split(':')[0] : sParts[0];
            let endStr = eParts[0];
            return `${startStr}-${endStr} ${eParts[1]}`;
        }

        function formatGapTime(gapMins) {
            let h = Math.floor(gapMins / 60);
            let m = gapMins % 60;
            let hrText = h > 1 ? 'hrs' : 'hr';
            let minText = m === 1 ? 'min' : 'mins'; 
            
            if (h > 0 && m > 0) return `${h} ${hrText} ${m} ${minText}`;
            if (h > 0) return `${h} ${hrText}`;
            return `${m} ${minText}`;
        }

        function validateAndAdd() {
            let config = subjectsConfig[activeSubject];
            let errTime = document.getElementById('err-time');
            let errSec = document.getElementById('err-section');
            errTime.style.display = 'none'; errSec.style.display = 'none';

            let secRaw = document.getElementById('input-section').value.trim();
            let formattedSection = "Null";
            if (secRaw !== "") {
                let secMatch = secRaw.match(/^([a-zA-Z])\s*-?\s*(\d{1,2})$/);
                if (!secMatch) { errSec.style.display = 'block'; return; }
                formattedSection = `${secMatch[1].toUpperCase()}-${parseInt(secMatch[2], 10)}`;
            }
            
            let teacherRaw = document.getElementById('input-teacher').value.trim();
            let teacher = "Null";
            if (teacherRaw !== "") {
                // Converts input to Title Case (e.g., "dr. john doe" -> "Dr. John Doe")
                teacher = teacherRaw.split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.substring(1).toLowerCase()).join(' ');
            }

            let startRaw = document.getElementById('input-start').value.trim();
            if (!startRaw) {
                errTime.innerText = "Please enter a Start Time.";
                errTime.style.display = 'block'; return;
            }

            let startMins = parseSmartTime(startRaw);
            if (startMins === null) {
                errTime.innerText = "Invalid time format (e.g. 2pm, 1130).";
                errTime.style.display = 'block'; return;
            }
            let endMins = startMins + config.reqMins; 

            let day1 = document.getElementById('input-day1').value;
            let daysToRegister = [day1];
            let day2 = null;
            
            let needsSecondDay = config.daysReq === 2 || (config.daysReq === "dynamic" && document.getElementById('input-classes').value === "2");
            
            if (needsSecondDay) {
                day2 = document.getElementById('input-day2').value;
                if (day1 === day2) {
                    endMins = startMins + (config.reqMins * 2);
                } else {
                    daysToRegister.push(day2);
                }
            }

            for (let day of daysToRegister) {
                for (let existingClass of timetable[day]) {
                    if (existingClass.id === activeSubject) continue; 
                    if (startMins < existingClass.end && endMins > existingClass.start) {
                        errTime.innerText = `TIMETABLE CLASH ON ${day}! Overlaps with ${existingClass.subject.split('<br>')[0].replace(/<[^>]*>?/gm, '')}.`;
                        errTime.style.display = 'block'; return;
                    }
                }
            }

            for (let day of daysOfWeek) timetable[day] = timetable[day].filter(c => c.id !== activeSubject);

            registeredData[activeSubject] = {
                section: formattedSection, teacher: teacher, startFormatted: formatForInput(startMins),
                day1: day1, day2: needsSecondDay ? day2 : null,
                classes: config.daysReq === "dynamic" ? document.getElementById('input-classes').value : null
            };

            let subNameClean = config.type === "lab" ? activeSubject.replace(' lab', ' LAB') : activeSubject;
            let subNameDisplay = `<strong>${subNameClean}</strong><br>(${formattedSection}) (${config.credits})`;

            let newCourse = {
                id: activeSubject,
                subject: subNameDisplay, teacher: teacher,
                start: startMins, end: endMins,
                timeDisplay: buildTimeDisplay(startMins, endMins),
                color: config.color 
            };

            for (let day of daysToRegister) {
                timetable[day].push(newCourse);
                timetable[day].sort((a, b) => a.start - b.start);
            }

            let safeId = activeSubject.replace(/\s+/g, '-');
            document.getElementById(`btn-${safeId}`).classList.add('registered');
            document.getElementById(`container-${safeId}`).classList.add('is-registered');
            
            closeModal();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = ''; 

            for (let day of daysOfWeek) {
                let classes = timetable[day];
                
                if (classes.length === 0) {
                    tbody.innerHTML += `<tr class="day-end-row"><td class="day-col">${day}</td><td></td><td></td><td></td></tr>`;
                    continue;
                }

                let totalGapMins = 0;
                let gaps = [];

                for (let i = 0; i < classes.length - 1; i++) {
                    let gapDiff = classes[i + 1].start - classes[i].end;
                    gaps.push(gapDiff);
                    if (gapDiff > 0) totalGapMins += gapDiff;
                }

                for (let i = 0; i < classes.length; i++) {
                    let c = classes[i];
                    let tr = document.createElement('tr');
                    
                    if (i === classes.length - 1) {
                        tr.className = 'day-end-row';
                    }
                    
                    if (i === 0) {
                        let tdDay = document.createElement('td');
                        tdDay.className = 'day-col';
                        tdDay.rowSpan = classes.length;
                        tdDay.innerHTML = day;
                        
                        tdDay.innerHTML += `<span class="day-metric-text">Classes: ${classes.length}</span>`;
                        
                        let totalTimeSpentMins = classes[classes.length - 1].end - classes[0].start;
                        tdDay.innerHTML += `<span class="day-metric-text">Total Time: ${formatGapTime(totalTimeSpentMins)}</span>`;

                        if (totalGapMins > 0) {
                            tdDay.innerHTML += `<span class="day-metric-text">Total Gap: ${formatGapTime(totalGapMins)}</span>`;
                        }
                        tr.appendChild(tdDay);
                    }

                    let gapHtml = '';
                    if (i < classes.length - 1 && gaps[i] > 0) {
                        gapHtml = `
                            <div class="side-gap">
                                <span class="gap-bracket">}</span>
                                Gap: ${formatGapTime(gaps[i])}
                            </div>
                        `;
                    }

                    tr.innerHTML += `
                        <td style="background-color: ${c.color}; color: white;">${c.subject}</td>
                        <td style="background-color: ${c.color}; color: white;"><strong>${c.teacher}</strong></td>
                        <td class="time-cell" style="background-color: ${c.color}; color: white;">
                            <strong>${c.timeDisplay}</strong>
                            ${gapHtml}
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            }
        }

        function clearSchedule() {
            if(confirm("Are you sure you want to reset your entire schedule?")) {
                timetable = { MONDAY: [], TUESDAY: [], WEDNESDAY: [], THURSDAY: [], FRIDAY: [], SATURDAY: [] };
                registeredData = {};
                document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('registered'));
                document.querySelectorAll('.subject-container').forEach(c => c.classList.remove('is-registered'));
                renderTable();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
